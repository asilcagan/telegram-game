<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Telegram MMORPG</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="game/style.css">
</head>
<body>
    <div id="game-container">
        <!-- Karakter Seçim Ekranı -->
        <div id="character-select" class="screen">
            <h2>Karakter Seçimi</h2>
            <div class="character-grid">
                <div class="character-option" data-class="warrior">
                    <img src="game/assets/warrior.png" alt="Warrior">
                    <h3>Warrior</h3>
                </div>
                <div class="character-option" data-class="archer">
                    <img src="game/assets/archer.png" alt="Archer">
                    <h3>Archer</h3>
                </div>
                <div class="character-option" data-class="mage">
                    <img src="game/assets/mage.png" alt="Mage">
                    <h3>Mage</h3>
                </div>
                <div class="character-option" data-class="priest">
                    <img src="game/assets/priest.png" alt="Priest">
                    <h3>Priest</h3>
                </div>
                <div class="character-option" data-class="assassin">
                    <img src="game/assets/assassin.png" alt="Assassin">
                    <h3>Assassin</h3>
                </div>
                <div class="character-option" data-class="beastmaster">
                    <img src="game/assets/beastmaster.png" alt="Beastmaster">
                    <h3>Beastmaster</h3>
                </div>
            </div>
        </div>

        <!-- Oyun Ana Ekranı -->
        <div id="game-screen" class="screen hidden">
            <!-- Karakter Bilgileri -->
            <div id="character-info">
                <div id="level-info">
                    <span id="character-level">Lvl 1</span>
                    <span id="character-name">Player</span>
                </div>
                <div id="stats">
                    <div class="stat-bar hp">
                        <div class="stat-fill"></div>
                        <span class="stat-text">HP: 100/100</span>
                    </div>
                    <div class="stat-bar mp">
                        <div class="stat-fill"></div>
                        <span class="stat-text">MP: 100/100</span>
                    </div>
                    <div class="stat-bar exp">
                        <div class="stat-fill"></div>
                        <span class="stat-text">EXP: 0/1000</span>
                    </div>
                </div>
            </div>

            <!-- Harita ve Lokasyon -->
            <div id="map-container">
                <div id="current-location">Training Ground</div>
                <div id="map-area"></div>
            </div>

            <!-- Envanter ve Ekipman -->
            <div id="inventory-container">
                <div id="equipment">
                    <!-- Ekipman slotları -->
                </div>
                <div id="inventory">
                    <!-- Envanter slotları -->
                </div>
            </div>

            <!-- Kontrol Butonları -->
            <div id="controls">
                <button id="attack-btn">Saldır</button>
                <button id="skill-btn">Yetenekler</button>
                <button id="inventory-btn">Envanter</button>
                <button id="map-btn">Harita</button>
            </div>
        </div>
    </div>
    <script src="game/game.js"></script>
</body>
</html>
