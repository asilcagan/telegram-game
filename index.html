<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WYD Style MMORPG</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --primary-color: #4CAF50;
            --secondary-color: #2196F3;
            --background-color: #1a1a1a;
            --text-color: #ffffff;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: var(--background-color);
            color: var(--text-color);
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        #game-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        #character {
            text-align: center;
            margin-bottom: 20px;
        }

        #character-sprite {
            width: 100px;
            height: 100px;
            object-fit: contain;
        }

        #character-info {
            margin-top: 10px;
        }

        #health-bar {
            width: 200px;
            height: 20px;
            background-color: #ff0000;
            margin: 10px auto;
            border-radius: 10px;
            overflow: hidden;
        }

        #health-fill {
            width: 100%;
            height: 100%;
            background-color: #00ff00;
            transition: width 0.3s ease;
        }

        #game-ui {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        #stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            background-color: rgba(0, 0, 0, 0.5);
            padding: 15px;
            border-radius: 10px;
        }

        #controls {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s;
            touch-action: manipulation;
        }

        button:hover {
            background-color: #45a049;
        }

        #inventory-btn {
            background-color: var(--secondary-color);
        }

        #inventory-btn:hover {
            background-color: #1976D2;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="character">
            <div id="character-sprite">👤</div>
            <div id="character-info">
                <span id="character-name">Player</span>
                <div id="health-bar">
                    <div id="health-fill"></div>
                </div>
            </div>
        </div>
        
        <div id="game-ui">
            <div id="stats">
                <div>Level: <span id="level">1</span></div>
                <div>HP: <span id="hp">100</span>/100</div>
                <div>EXP: <span id="exp">0</span>/100</div>
            </div>
            
            <div id="controls">
                <button id="attack-btn">Saldır</button>
                <button id="inventory-btn">Envanter</button>
                <button id="shop-btn">Mağaza</button>
            </div>
        </div>
    </div>

    <script>
        // Telegram Web App'i başlat
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        // Oyuncu sınıfı
        class Player {
            constructor(name) {
                this.name = name;
                this.level = 1;
                this.hp = 100;
                this.maxHp = 100;
                this.exp = 0;
                this.expToNextLevel = 100;
                this.inventory = [];
            }

            gainExp(amount) {
                this.exp += amount;
                console.log(`Gained ${amount} EXP. Total: ${this.exp}/${this.expToNextLevel}`);
                if (this.exp >= this.expToNextLevel) {
                    this.levelUp();
                }
                this.updateUI();
            }

            levelUp() {
                this.level++;
                this.exp = 0;
                this.maxHp += 20;
                this.hp = this.maxHp;
                this.expToNextLevel = Math.floor(this.expToNextLevel * 1.5);
                console.log(`Level Up! New level: ${this.level}, Next level EXP needed: ${this.expToNextLevel}`);
                tg.showAlert(`🎉 Tebrikler! Level ${this.level} oldunuz!\nYeni can puanınız: ${this.maxHp}\nSonraki level için gereken EXP: ${this.expToNextLevel}`);
            }

            takeDamage(amount) {
                this.hp = Math.max(0, this.hp - amount);
                this.updateUI();
                if (this.hp <= 0) {
                    tg.showAlert('Öldünüz! Yeniden doğuyorsunuz...');
                    this.hp = this.maxHp;
                }
            }

            updateUI() {
                document.getElementById('level').textContent = this.level;
                document.getElementById('hp').textContent = this.hp;
                document.getElementById('exp').textContent = this.exp;
                
                const healthPercent = (this.hp / this.maxHp) * 100;
                document.getElementById('health-fill').style.width = `${healthPercent}%`;
            }
        }

        // Düşman sınıfı
        class Enemy {
            constructor(level) {
                this.level = level;
                this.hp = 50 + (level * 10);
                this.maxHp = this.hp;
                this.damage = 5 + (level * 2);
                this.expReward = 20 + (level * 5);
            }
        }

        // Oyun durumu
        const gameState = {
            player: new Player(tg.initDataUnsafe?.user?.first_name || "Player"),
            currentEnemy: null,
            isInCombat: false
        };

        // Event listeners
        document.getElementById('attack-btn').addEventListener('click', () => {
            if (!gameState.isInCombat) {
                startCombat();
            } else {
                attack();
            }
        });

        document.getElementById('inventory-btn').addEventListener('click', () => {
            showInventory();
        });

        document.getElementById('shop-btn').addEventListener('click', () => {
            showShop();
        });

        // Combat fonksiyonları
        function startCombat() {
            gameState.currentEnemy = new Enemy(gameState.player.level);
            gameState.isInCombat = true;
            tg.showAlert(`Seviye ${gameState.currentEnemy.level} düşmanla karşılaştınız!\nDüşman HP: ${gameState.currentEnemy.hp}\nKazanılacak EXP: ${gameState.currentEnemy.expReward}`);
        }

        function attack() {
            if (!gameState.currentEnemy) return;

            // Oyuncu saldırısı
            const playerDamage = 10 + Math.floor(Math.random() * 5) + (gameState.player.level * 2);
            gameState.currentEnemy.hp -= playerDamage;
            tg.showAlert(`⚔️ Düşmana ${playerDamage} hasar verdiniz!\nDüşman HP: ${gameState.currentEnemy.hp}`);

            // Düşman ölürse
            if (gameState.currentEnemy.hp <= 0) {
                const expGained = gameState.currentEnemy.expReward;
                tg.showAlert(`🎯 Düşmanı yendiniz!\n💫 ${expGained} EXP kazandınız!\nMevcut EXP: ${gameState.player.exp + expGained}/${gameState.player.expToNextLevel}`);
                gameState.player.gainExp(expGained);
                gameState.isInCombat = false;
                gameState.currentEnemy = null;
                return;
            }

            // Düşman saldırısı
            const enemyDamage = gameState.currentEnemy.damage;
            gameState.player.takeDamage(enemyDamage);
            tg.showAlert(`🗡️ Düşman size ${enemyDamage} hasar verdi!\nKalan HP: ${gameState.player.hp}/${gameState.player.maxHp}`);
        }

        function showInventory() {
            if (gameState.player.inventory.length === 0) {
                tg.showAlert('Envanteriniz boş!');
            } else {
                tg.showAlert('Envanter: ' + gameState.player.inventory.join(', '));
            }
        }

        function showShop() {
            tg.showAlert('Mağaza yakında açılacak!');
        }

        // Oyunu başlat
        gameState.player.updateUI();
    </script>
</body>
</html>
