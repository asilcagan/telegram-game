<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WYD Style MMORPG</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/5.3.3/pixi.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/nipplejs@0.10.1/dist/nipplejs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Karakter Seçim Ekranı -->
    <div id="character-select" class="screen">
        <h2>Karakter Seçimi</h2>
        <div class="character-grid">
            <div class="character-option" data-class="warrior">
                <img src="assets/warrior.png" alt="Warrior">
                <h3>Warrior</h3>
                <p>Güçlü ve dayanıklı savaşçı</p>
            </div>
            <div class="character-option" data-class="archer">
                <img src="assets/archer.png" alt="Archer">
                <h3>Archer</h3>
                <p>Uzak mesafe hasarı</p>
            </div>
            <div class="character-option" data-class="mage">
                <img src="assets/mage.png" alt="Mage">
                <h3>Mage</h3>
                <p>Büyü hasarı uzmanı</p>
            </div>
            <div class="character-option" data-class="priest">
                <img src="assets/priest.png" alt="Priest">
                <h3>Priest</h3>
                <p>İyileştirme ve destek</p>
            </div>
            <div class="character-option" data-class="assassin">
                <img src="assets/assassin.png" alt="Assassin">
                <h3>Assassin</h3>
                <p>Hızlı ve ölümcül</p>
            </div>
            <div class="character-option" data-class="beastmaster">
                <img src="assets/beastmaster.png" alt="Beastmaster">
                <h3>Beastmaster</h3>
                <p>Hayvan kontrolü</p>
            </div>
        </div>
    </div>

    <!-- Oyun Ekranı -->
    <div id="game-screen" class="screen" style="display: none;">
        <canvas id="game-canvas" style="display: block; width: 100%; height: 100%;"></canvas>
        
        <!-- HUD -->
        <div class="hud">
            <div class="stat-bar">
                <div class="stat">
                    <span>Level:</span>
                    <span id="level">1</span>
                </div>
                <div class="stat">
                    <span>HP:</span>
                    <div class="progress-bar">
                        <div id="hp-bar" class="progress"></div>
                    </div>
                    <span id="hp">100/100</span>
                </div>
                <div class="stat">
                    <span>MP:</span>
                    <div class="progress-bar">
                        <div id="mp-bar" class="progress"></div>
                    </div>
                    <span id="mp">50/50</span>
                </div>
                <div class="stat">
                    <span>EXP:</span>
                    <div class="progress-bar">
                        <div id="exp-bar" class="progress"></div>
                    </div>
                    <span id="exp">0/100</span>
                </div>
            </div>
        </div>

        <!-- Joystick -->
        <div id="joystick-area"></div>

        <!-- Skill Butonları -->
        <div id="skill-buttons">
            <button id="attack" class="skill-button">
                <img src="assets/attack.png" alt="Attack">
            </button>
            <button id="skill1" class="skill-button">
                <img src="assets/skill1.png" alt="Skill 1">
            </button>
            <button id="skill2" class="skill-button">
                <img src="assets/skill2.png" alt="Skill 2">
            </button>
            <button id="skill3" class="skill-button">
                <img src="assets/skill3.png" alt="Skill 3">
            </button>
        </div>

        <!-- Menü Butonu -->
        <button id="menu-button">
            <img src="assets/menu.png" alt="Menu">
        </button>
    </div>

    <script src="game.js"></script>
</body>
</html>
